<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
</head>

<body>
    <div id="app">
        <v-app>
            <v-main>
                <v-container>
                    <v-row>
                        <v-col cols="12" sm="3">
                            <v-btn width="100%" href="./index.html">maJ-Mil!</v-btn>
                        </v-col>
                        <v-col cols="12" sm="3">
                            <v-btn width="100%" href="./boston.html">boston</v-btn>
                        </v-col>
                        <v-col cols="12" sm="3">
                            <v-btn width="100%" disabled>paris</v-btn>
                        </v-col>
                        <v-col cols="12" sm="3">
                            <v-btn width="100%" href="./usa.html">usa</v-btn>
                        </v-col>
                    </v-row>
                </v-container>

                <v-responsive class="align-centerfill-height mx-auto" max-width="900">
                    <div class="text-h5 text-center">Last Update: December 14, 2025</div>
                    <div class="text-h6 text-center">Number of Photos: {{ numberOfImages }}
                    </div>
                    <v-carousel hide-delimiters>
                        <v-carousel-item v-for="(item, i) in mappedImages" :key="i">
                            <v-img :src="item.src" height="100%" contain>
                                <template v-slot:placeholder>
                                    <v-row class="fill-height ma-0" align="center" justify="center">
                                        <v-progress-circular indeterminate color="grey darken-4"></v-progress-circular>
                                    </v-row>
                                </template>
                            </v-img>
                        </v-carousel-item>
                    </v-carousel>
                </v-responsive>
            </v-main>

            <v-footer padless>
                <v-col class="text-center" cols="12">
                    {{ new Date().getFullYear() }} - <strong>Byron J-Mil Hall</strong>
                </v-col>
            </v-footer>
        </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script>
        const numberOfImages = 53;
        const uInt8Array = new Uint8Array(numberOfImages);
        window.crypto.getRandomValues(uInt8Array);
        const numbersArray = Array.from({ length: numberOfImages }, (_, i) => i);

        // Shuffle the numbersArray
        for (let i = 0; i < numberOfImages; i += 1) {
            let swapIndex = uInt8Array[i] % numberOfImages;
            let swapValue = numbersArray[swapIndex];
            numbersArray[swapIndex] = numbersArray[i];
            numbersArray[i] = swapValue;
        }

        const mappedImages = numbersArray.map(x => ({
            src: `./images/paris/${x}.jpeg`
        }));

    </script>
    <script>
        new Vue({
            el: '#app',
            vuetify: new Vuetify(),
            data: function () {
                return {
                    numbersArray,
                    numberOfImages,
                    mappedImages
                };
            },
        })
    </script>
</body>

</html>
